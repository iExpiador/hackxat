<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Juegoslan</title>
    <style>
        html, body {
            background-color: transparent !important; 
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        * {
            text-decoration: none !important;
            box-sizing: border-box;
        }

        /* Contenedor tipo píldora, compacto y centrado */
        #com {
            position: fixed;
            background: linear-gradient(135deg, rgba(66, 112, 168, 0.85) 0%, rgba(44, 74, 110, 0.85) 100%);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            
            width: 310px;
            height: 54px;
            padding: 8px 12px;
            border-radius: 30px; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            
            left: 50%;
            transform: translateX(-50%);
            bottom: 15px; 
            
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6); 
            z-index: 9999;
            pointer-events: auto; 
        }

        /* Reproductor de Audio */
        audio {
            width: 100%;
            height: 38px;
            display: block;
            outline: none;
            border-radius: 20px;
            
            filter: invert(1) hue-rotate(180deg) brightness(1.2);
            transition: all 0.3s ease;
        }

        /* Efecto decorativo al pasar el mouse */
        audio:hover {
            filter: invert(1) hue-rotate(180deg) brightness(1.5) drop-shadow(0 0 8px rgba(0, 255, 255, 0.8));
            transform: scale(1.02);
        }
    </style>
</head>
<body onload="document.body.style.backgroundColor = 'transparent';">

    <div id="com">
        <audio controls autoplay>
            <!-- URL actualizada aquí -->
            <source src="https://radioanime.radioca.st/stream" type="audio/mpeg">
            Tu navegador no soporta el elemento de audio.
        </audio>
    </div>

</body>
</html>
