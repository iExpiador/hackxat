<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Juegoslan</title>
    <style>
        html, body {
            background-color: transparent !important; 
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        * {
            text-decoration: none !important;
        }

        #com {
            position: fixed;
            background: rgba(30, 40, 60, 0.65); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            height: 105px;
            width: 330px;
            right: 20px;
            bottom: 60px; 
            border-radius: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            text-align: center;
            box-sizing: border-box;
            padding: 12px 15px;
            z-index: 9999;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); 
            transition: transform 0.3s ease;
        }

        #com:hover {
            transform: translateY(-5px); 
        }

        audio {
            width: 100%;
            height: 38px;
            display: block;
            outline: none;
            filter: invert(1) hue-rotate(180deg) brightness(1.2);
            border-radius: 20px;
            margin-bottom: 8px;
        }

        .links-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-family: 'Trebuchet MS', Arial, sans-serif;
        }

        /* AQUÍ ESTÁ LA MAGIA: Letras blancas por defecto con su efecto */
        #rules {
            display: inline-block;
            z-index: 1;
            position: relative;
            font: bold 1.1em 'Trebuchet MS', Arial, sans-serif;
            color: transparent;
            transition: .5s;
            /* Cambiamos el #000 por #FFF para que sean blancas por defecto */
            text-shadow: 0 1em 0 transparent, 0 -1em 0 transparent, 2.5em 0 0 transparent, -2.5em 0 0 transparent, 0 0 0 #FFF;
        }

        #rules:hover {
            /* Efecto de resplandor brillante al pasar el ratón */
            text-shadow: 0 0 10px rgba(255,255,255,0.8), 0 0 20px rgba(255,255,255,0.5), 0 0 0 #FFF;
        }
        
        .sep {
            color: rgba(255, 255, 255, 0.3);
            font-size: 1.1em;
        }
    </style>
</head>
<body onload="document.body.style.backgroundColor = 'transparent';">

    <div id="com">
        <audio controls autoplay>
            <source src="http://192.99.14.225:9862/;s.mp3" type="audio/mpeg">
        </audio>
        
        <div class="links-container">
            <a href="http://www.facebook.com/groups/juegoslanx" target="_blank"><span id="rules">Facebook Group</span></a> 
            <span class="sep">|</span> 
            <a href="http://pastebin.com/EpzCE3m9" target="_blank"><span id="rules">Reglas</span></a>
        </div>
    </div>

</body>
</html>
