<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Juegoslan</title>
    <style>
        /* 1. RESET Y TRANSPARENCIA PARA EL XATFRAME */
        html, body {
            background-color: transparent !important; 
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        * {
            box-sizing: border-box;
        }

        /* 2. CAPA DE FONDO (TU IMAGEN DE JUEGOS) */
        #bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('https://xatimg.com/image/YKF2Fh6DfYVe.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
        }

        /* 3. PANEL DE LA RADIO CON ESTILO GAMER/NEON */
        #com {
            position: fixed;
            background: rgba(10, 15, 30, 0.75); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            
            width: 310px;
            height: 54px;
            padding: 8px 12px;
            border-radius: 30px; 
            
            border: 2px solid rgba(0, 255, 255, 0.6); 
            
            left: 50%;
            transform: translateX(-50%);
            bottom: 15px; 
            
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3), inset 0 0 10px rgba(0, 255, 255, 0.2); 
            z-index: 9999;
            pointer-events: auto; 
            transition: all 0.3s ease;
        }

        #com:hover {
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.6), inset 0 0 15px rgba(0, 255, 255, 0.3);
            border-color: rgba(0, 255, 255, 1);
        }

        /* 4. REPRODUCTOR DE AUDIO */
        audio {
            width: 100%;
            height: 38px;
            display: block;
            outline: none;
            border-radius: 20px;
            filter: invert(1) hue-rotate(180deg) brightness(1.2);
            transition: all 0.3s ease;
        }

        audio:hover {
            filter: invert(1) hue-rotate(180deg) brightness(1.5) drop-shadow(0 0 8px rgba(0, 255, 255, 0.8));
            transform: scale(1.02);
        }
    </style>
</head>
<body onload="document.body.style.backgroundColor = 'transparent';">

    <!-- Capa con la imagen de fondo -->
    <div id="bg"></div>

    <!-- Reproductor de Radio -->
    <div id="com">
        <audio controls autoplay>
            <source src="https://stream.mundoxat.org:8018/stream" type="audio/mpeg">
            Tu navegador no soporta el elemento de audio.
        </audio>
    </div>

</body>
</html>
